<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="icon" type="image/png" href="../asset/logo_Fruver_Panorama.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <h1>Crea tu cuenta en Fruver Panorama</h1>
        <form action="../../controlador/procesamiento_login.php" method="post"> 
            
            <label class="form-label">Correo electrónico</label>
            <div class="input-group">
                <span class="input-icon">✉️</span>
                <input type="email" name="correo" placeholder="ejemplo@correo.com" maxlength="100" required>
            </div>
            
            <label class="form-label">Contraseña</label>
            <div class="input-group">
                <span class="input-icon">🔒</span>
                <!-- Se añadieron los límites minlength y maxlength respetando el nombre original (name="calve") -->
                <input type="password" name="clave" placeholder="Introduce tu contraseña" minlength="8" maxlength="30" required> 
            </div>

            <div class="grupo-seleccion">
                <p class="titulo-grupo">Selecciona tu Rol:</p>
                <div class="opciones-contenedor">
                    <!-- Opción 1: El atributo "required" aquí obliga a seleccionar una opción del grupo "rol" -->
                    <div class="opcion-item">
                        <input type="radio" id="opt-admin" name="rol" value="1" class="input-oculto" required>
                        <label for="opt-admin" class="boton-seleccion">Administrador</label>
                    </div>

                    <!-- Opción 2 -->
                    <div class="opcion-item">
                        <input type="radio" id="opt-cliente" name="rol" value="2" class="input-oculto">
                        <label for="opt-cliente" class="boton-seleccion">Cliente</label>
                    </div>

                    <!-- Opción 3 -->
                    <div class="opcion-item">
                        <input type="radio" id="opt-domiciliario" name="rol" value="3" class="input-oculto">
                        <label for="opt-domiciliario" class="boton-seleccion">Domiciliario</label>
                    </div>
                </div>
            </div>

            <button type="submit" class="login-btn">Login</button>
            
            <div class="register-link">
                ¿No tienes una cuenta? <a href="../html/register.html">Register</a>
            </div>
        </form>
    </div>
</body>
</html>
